- name: 生成 MCC 設定檔 (MinecraftClient.toml)
        run: |
          cat << 'EOF' > MinecraftClient.toml
[main]
ip = "baystellardynasty.aternos.me:45295"
login = "offline"
username = "AFK_Bot_1"

[appvars]
showlinks = false

[autoafk]
enabled = true
delay = 10
command = "/ping"

[reconnectionservice]
enabled = true
delay = 10
interval = 300
EOF

      - name: 印出並確認設定檔
        run: cat MinecraftClient.toml

      - name: 啟動 MCC 專用掛機機器人
        run: |
          ./MinecraftClient
