name: 24/7 AFK Bot (MCC C# Client)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-mcc-afk:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出儲存庫專案
        uses: actions/checkout@v3

      - name: 下載並設定 Minecraft Console Client (MCC)
        run: |
          # 下載 MCC 最新 Linux x64 執行檔
          curl -s https://api.github.com/repos/MCCTeam/Minecraft-Console-Client/releases/latest \
          | grep "browser_download_url.*MinecraftClient.*linux-x64" \
          | cut -d : -f 2,3 \
          | tr -d \" \
          | wget -qi - -O MinecraftClient

          chmod +x MinecraftClient

      - name: 生成 MCC 設定檔 (MinecraftClient.ini)
        run: |
          cat <<'EOF' > MinecraftClient.ini
          [Main]
          ip=baystellardynasty.aternos.me:45295
          login=offline
          username=AFK_Bot_1
          password=-

          [AppVars]
          showlinks=false

          [AutoAFK]
          enabled=true
          delay=10
          command=/ping

          [ReconnectionService]
          enabled=true
          delay=10
          interval=300
          EOF

          # 清除 ini 檔內開頭不小心產生的縮排空白
          sed -i 's/^[ \t]*//' MinecraftClient.ini

      - name: 啟動 MCC 專用掛機機器人
        run: |
          ./MinecraftClient
