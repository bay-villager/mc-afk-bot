name: 24/7 AFK Bot (MCC)

on:
  workflow_dispatch: # 支援手動按下 Run workflow 啟動
  schedule:
    - cron: '0 */5 * * *' # 每 5 小時自動重新啟動，防止 GitHub Actions 超時斷線

jobs:
  run-mcc-bots:
    runs-on: ubuntu-latest
    steps:
      - name: 下載 Minecraft Console Client (MCC)
        run: |
          wget https://github.com/MC-State/Minecraft-Console-Client/releases/latest/download/MinecraftClient-Linux-x64
          chmod +x MinecraftClient-Linux-x64

      - name: 建立 AFK_Bot_1 設定檔
        run: |
          cat <<'EOF' > bot1.ini
          [Main]
          ServerIP=baystellardynasty.aternos.me:45295
          Username=AFK_Bot_1
          Version=26.3
          ScriptEnabled=false

          [AppConfig]
          AutoRespawn=true
          ReconnectOnDisconnect=true
          ReconnectInterval=10
          EOF

      - name: 建立 AFK_Bot_2 設定檔
        run: |
          cat <<'EOF' > bot2.ini
          [Main]
          ServerIP=baystellardynasty.aternos.me:45295
          Username=AFK_Bot_2
          Version=26.3
          ScriptEnabled=false

          [AppConfig]
          AutoRespawn=true
          ReconnectOnDisconnect=true
          ReconnectInterval=10
          EOF

      - name: 同時啟動兩隻 AFK Bot
        run: |
          echo "正在啟動 AFK_Bot_1..."
          ./MinecraftClient-Linux-x64 bot1.ini &
          
          sleep 10
          
          echo "正在啟動 AFK_Bot_2..."
          ./MinecraftClient-Linux-x64 bot1.ini bot2.ini &
          
          # 保持背景工作持續運作
          wait
