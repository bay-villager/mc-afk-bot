name: 24/7 AFK Bot (MCC)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-mcc-bots:
    runs-on: ubuntu-latest
    steps:
      - name: 安裝解壓縮工具與下載 MCC
        run: |
          sudo apt-get update && sudo apt-get install -y unzip jq
          
          # 透過 API 取得最新的 Linux zip 下載網址
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/MC-State/Minecraft-Console-Client/releases/latest | jq -r '.assets[] | select(.name | contains("linux")) | .browser_download_url' | head -n 1)
          
          echo "正在下載: $DOWNLOAD_URL"
          curl -L -o mcc.zip "$DOWNLOAD_URL"
          
          unzip mcc.zip -d mcc_bin
          chmod +x mcc_bin/MinecraftClient
          
      - name: 建立 AFK_Bot_1 設定檔
        run: |
          cat <<'EOF' > bot1.ini
          [Main]
          ServerIP=baystellardynasty.aternos.me:45295
          Username=AFK_Bot_1
          Version=26.3
          ScriptEnabled=false

          [AppConfig]
          AutoRespawn=true
          ReconnectOnDisconnect=true
          ReconnectInterval=10
          EOF

      - name: 建立 AFK_Bot_2 設定檔
        run: |
          cat <<'EOF' > bot2.ini
          [Main]
          ServerIP=baystellardynasty.aternos.me:45295
          Username=AFK_Bot_2
          Version=26.3
          ScriptEnabled=false

          [AppConfig]
          AutoRespawn=true
          ReconnectOnDisconnect=true
          ReconnectInterval=10
          EOF

      - name: 同時啟動兩隻 AFK Bot
        run: |
          echo "正在啟動 AFK_Bot_1..."
          ./mcc_bin/MinecraftClient bot1.ini &
          
          sleep 10
          
          echo "正在啟動 AFK_Bot_2..."
          ./mcc_bin/MinecraftClient bot2.ini &
          
          wait
