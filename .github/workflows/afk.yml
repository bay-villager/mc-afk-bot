name: 24/7 AFK Bot (MCC)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-mcc-bots:
    runs-on: ubuntu-latest
    steps:
      - name: 下載 Minecraft Console Client (MCC)
        run: |
          # 自動從 GitHub Release 抓取最新的 Linux x64 可執行檔
          URL=$(curl -s https://api.github.com/repos/MC-State/Minecraft-Console-Client/releases/latest | grep "browser_download_url.*Linux-x64" | cut -d : -f 2,3 | tr -d \")
          if [ -z "$URL" ]; then
            # 若無特定命名，則備用抓取第一個 Linux 壓縮包或檔案
            URL=$(curl -s https://api.github.com/repos/MC-State/Minecraft-Console-Client/releases/latest | grep "browser_download_url" | head -n 1 | cut -d : -f 2,3 | tr -d \")
          fi
          echo "Downloading from $URL..."
          wget -O MinecraftClient-Linux-x64 "$URL"
          chmod +x MinecraftClient-Linux-x64

      - name: 建立 AFK_Bot_1 設定檔
        run: |
          cat <<'EOF' > bot1.ini
          [Main]
          ServerIP=baystellardynasty.aternos.me:45295
          Username=AFK_Bot_1
          Version=26.3
          ScriptEnabled=false

          [AppConfig]
          AutoRespawn=true
          ReconnectOnDisconnect=true
          ReconnectInterval=10
          EOF

      - name: 建立 AFK_Bot_2 設定檔
        run: |
          cat <<'EOF' > bot2.ini
          [Main]
          ServerIP=baystellardynasty.aternos.me:45295
          Username=AFK_Bot_2
          Version=26.3
          ScriptEnabled=false

          [AppConfig]
          AutoRespawn=true
          ReconnectOnDisconnect=true
          ReconnectInterval=10
          EOF

      - name: 同時啟動兩隻 AFK Bot
        run: |
          echo "正在啟動 AFK_Bot_1..."
          ./MinecraftClient-Linux-x64 bot1.ini &
          
          sleep 10
          
          echo "正在啟動 AFK_Bot_2..."
          ./MinecraftClient-Linux-x64 bot2.ini &
          
          wait
