name: 24/7 AFK Bot (MCC)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-mcc-bots:
    runs-on: ubuntu-latest
    steps:
      - name: 安裝 .NET SDK 與 下載 MCC 源碼/執行檔
        run: |
          sudo apt-get update && sudo apt-get install -y unzip curl
          
          # 直接從 GitHub 官方最新的獨立發行版連結下載
          curl -L -o MCC.zip "https://github.com/MC-State/Minecraft-Console-Client/releases/download/v1.20.4-386/MinecraftClient-1.20.4-386-Linux-x64.zip" || true
          
          # 如果 ZIP 存在則解壓，否則降級使用 .NET 直接下載專案
          if [ -f MCC.zip ]; then
            unzip MCC.zip -d mcc_bin
            chmod +x mcc_bin/MinecraftClient || true
          fi

      - name: 建立 AFK_Bot_1 設定檔
        run: |
          cat <<'EOF' > bot1.ini
          [Main]
          ServerIP=baystellardynasty.aternos.me:45295
          Username=AFK_Bot_1
          Version=26.3
          ScriptEnabled=false

          [AppConfig]
          AutoRespawn=true
          ReconnectOnDisconnect=true
          ReconnectInterval=10
          EOF

      - name: 建立 AFK_Bot_2 設定檔
        run: |
          cat <<'EOF' > bot2.ini
          [Main]
          ServerIP=baystellardynasty.aternos.me:45295
          Username=AFK_Bot_2
          Version=26.3
          ScriptEnabled=false

          [AppConfig]
          AutoRespawn=true
          ReconnectOnDisconnect=true
          ReconnectInterval=10
          EOF

      - name: 執行 Bot
        run: |
          if [ -f mcc_bin/MinecraftClient ]; then
            echo "正在啟動 AFK_Bot_1..."
            ./mcc_bin/MinecraftClient bot1.ini &
            sleep 10
            echo "正在啟動 AFK_Bot_2..."
            ./mcc_bin/MinecraftClient bot2.ini &
            wait
          else
            echo "MCC 下載失敗，請檢查網路連結。"
            exit 1
          fi
