name: 24/7 AFK Bot (Lightweight Real Player)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-afk-bots:
    runs-on: ubuntu-latest
    steps:
      - name: 安裝 Node.js 與 Mineflayer
        run: |
          npm init -y
          npm install mineflayer

      - name: 建立極簡輕量 AFK Bot 腳本
        run: |
          cat <<'EOF' > real_bot.js
          const mineflayer = require('mineflayer');

          const HOST = 'baystellardynasty.aternos.me';
          const PORT = 45295;

          function createBot(username) {
            console.log(`🤖 [${username}] 正在嘗試登入伺服器...`);
            
            const bot = mineflayer.createBot({
              host: HOST,
              port: PORT,
              username: username,
              version: false,
              loadInternalPlugins: false, // 停用內部不必要的插件以避免區塊解析錯誤
              checkTimeoutInterval: 60 * 1000
            });

            // 僅保留 KeepAlive 基礎插件，防止協議解析崩潰
            bot.loadPlugin(require('mineflayer/lib/plugins/keepalive'));
            bot.loadPlugin(require('mineflayer/lib/plugins/chat'));

            bot.once('spawn', () => {
              console.log(`🟢 [${username}] 成功穩定掛機在世界中！Aternos 關機倒數已停用。`);
            });

            bot.on('error', (err) => {
              console.log(`⚠️ [${username}] 發生錯誤:`, err.message);
            });

            bot.on('end', (reason) => {
              console.log(`🔴 [${username}] 已斷開連線 (${reason})，10 秒後重新登入...`);
              setTimeout(() => createBot(username), 10000);
            });
          }

          // 啟動 AFK 機器人
          createBot('AFK_Bot_1');
          setTimeout(() => {
            createBot('AFK_Bot_2');
          }, 8000);
          EOF

      - name: 執行 AFK 機器人
        run: node real_bot.js
