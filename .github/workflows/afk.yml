name: 24/7 AFK Bot (MCC C# Client)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-mcc-afk:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出儲存庫專案
        uses: actions/checkout@v3

      - name: 下載並設定 Minecraft Console Client (MCC)
        run: |
          # 下載 MCC 最新 Linux x64 執行檔
          curl -s https://api.github.com/repos/MCCTeam/Minecraft-Console-Client/releases/latest \
          | grep "browser_download_url.*MinecraftClient.*linux-x64" \
          | cut -d : -f 2,3 \
          | tr -d \" \
          | wget -qi - -O MinecraftClient

          chmod +x MinecraftClient

      - name: 生成新版 MCC TOML 設定檔 (MinecraftClient.ini)
        run: |
          cat <<'EOF' > MinecraftClient.ini
          [Main]
          # 新版 TOML 規範：所有字串都必須加上雙引號 ""
          ServerIP = "baystellardynasty.aternos.me:45295"
          Username = "AFK_Bot_1"
          Type = "offline"
          Version = "1.20.1"

          [AppVars]
          ShowLinks = false

          [AutoAFK]
          Enabled = true
          Delay = 10
          Command = "/ping"

          [ReconnectionService]
          Enabled = true
          Delay = 10
          Interval = 300
          EOF

      - name: 啟動 MCC 專用掛機機器人
        run: |
          ./MinecraftClient
