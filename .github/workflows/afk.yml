name: 24/7 AFK Bot (MCC C# Client)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-mcc-afk:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出儲存庫專案
        uses: actions/checkout@v3

      - name: 下載並設定 Minecraft Console Client (MCC)
        run: |
          curl -s https://api.github.com/repos/MCCTeam/Minecraft-Console-Client/releases/latest \
          | grep "browser_download_url.*MinecraftClient.*linux-x64" \
          | cut -d : -f 2,3 \
          | tr -d \" \
          | wget -qi - -O MinecraftClient

          chmod +x MinecraftClient

      - name: 生成 MCC TOML 設定檔 (MinecraftClient.ini)
        run: |
          echo '[main]' > MinecraftClient.ini
          echo 'ip = "baystellardynasty.aternos.me:45295"' >> MinecraftClient.ini
          echo 'login = "offline"' >> MinecraftClient.ini
          echo 'username = "AFK_Bot_1"' >> MinecraftClient.ini
          echo '' >> MinecraftClient.ini
          echo '[appvars]' >> MinecraftClient.ini
          echo 'showlinks = false' >> MinecraftClient.ini
          echo '' >> MinecraftClient.ini
          echo '[autoafk]' >> MinecraftClient.ini
          echo 'enabled = true' >> MinecraftClient.ini
          echo 'delay = 10' >> MinecraftClient.ini
          echo 'command = "/ping"' >> MinecraftClient.ini
          echo '' >> MinecraftClient.ini
          echo '[reconnectionservice]' >> MinecraftClient.ini
          echo 'enabled = true' >> MinecraftClient.ini
          echo 'delay = 10' >> MinecraftClient.ini
          echo 'interval = 300' >> MinecraftClient.ini

          # 檢查生成的設定檔內容
          cat MinecraftClient.ini

      - name: 啟動 MCC 專用掛機機器人
        run: |
          ./MinecraftClient
