name: 24/7 AFK Bot (MCC C# Client)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-mcc-afk:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出儲存庫專案
        uses: actions/checkout@v4

      - name: 下載並設定 Minecraft Console Client (MCC)
        run: |
          curl -s https://api.github.com/repos/MCCTeam/Minecraft-Console-Client/releases/latest \
          | grep "browser_download_url.*MinecraftClient.*linux-x64" \
          | cut -d : -f 2,3 \
          | tr -d \" \
          | wget -qi - -O MinecraftClient

          chmod +x MinecraftClient

      - name: 強制建立正確設定檔
        run: |
          printf '[main]\nip = "baystellardynasty.aternos.me:45295"\nlogin = "offline"\nusername = "AFK_Bot_1"\n\n[appvars]\nshowlinks = false\n\n[autoafk]\nenabled = true\ndelay = 10\ncommand = "/ping"\n\n[reconnectionservice]\nenabled = true\ndelay = 10\ninterval = 300\n' > MinecraftClient.ini

      - name: 啟動 MCC 專用掛機機器人（自動輸入 1 與 ID 作為備案）
        run: |
          printf "1\nAFK_Bot_1\n" | ./MinecraftClient
