name: 24/7 AFK Bot (In-Game Real Player)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-afk-bots:
    runs-on: ubuntu-latest
    steps:
      - name: 安裝 Node.js 與 Mineflayer
        run: |
          npm init -y
          npm install mineflayer

      - name: 建立 AFK Bot 腳本
        run: |
          cat <<'EOF' > real_bot.js
          const mineflayer = require('mineflayer');

          const HOST = 'baystellardynasty.aternos.me';
          const PORT = 45295;

          function createBot(username) {
            console.log(`🤖 [${username}] 正在嘗試登入伺服器...`);
            
            const bot = mineflayer.createBot({
              host: HOST,
              port: PORT,
              username: username,
              version: false, // 自動匹配 26.3/ViaVersion 協定
              checkTimeoutInterval: 60 * 1000
            });

            // 關閉物理運動，徹底避免 26.3 的 invalid_player_movement 踢出
            bot.once('spawn', () => {
              console.log(`🟢 [${username}] 成功進到遊戲世界中！Aternos 關機倒數已取消。`);
              if (bot.physics) {
                bot.physics.enabled = false;
              }
            });

            bot.on('chat', (username, message) => {
              // 收到聊天訊息時回覆，防止被當成假連線
              if (username === bot.username) return;
              if (message.includes('ping')) {
                bot.chat('pong!');
              }
            });

            bot.on('error', (err) => {
              console.log(`⚠️ [${username}] 發生錯誤:`, err.message);
            });

            bot.on('end', (reason) => {
              console.log(`🔴 [${username}] 已斷開連線 (${reason})，15 秒後重新登入...`);
              setTimeout(() => createBot(username), 15000);
            });
          }

          // 啟動 AFK 機器人
          createBot('AFK_Bot_1');
          setTimeout(() => {
            createBot('AFK_Bot_2');
          }, 10000);
          EOF

      - name: 執行 AFK 機器人
        run: node real_bot.js
