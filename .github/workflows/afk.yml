name: 24/7 AFK Bot (MCC C# Client)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-mcc-afk:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出儲存庫專案
        uses: actions/checkout@v3

      - name: 下載並設定 Minecraft Console Client (MCC)
        run: |
          # 下載 MCC 最新 Linux x64 執行檔
          curl -s https://api.github.com/repos/MCCTeam/Minecraft-Console-Client/releases/latest \
          | grep "browser_download_url.*MinecraftClient.*linux-x64" \
          | cut -d : -f 2,3 \
          | tr -d \" \
          | wget -qi - -O MinecraftClient

          chmod +x MinecraftClient

      - name: 生成 MCC 預設設定檔 (MinecraftClient.ini)
        run: |
          cat <<'EOF' > MinecraftClient.ini
          [Main]
          # Aternos 伺服器位置與連接埠
          serverip=baystellardynasty.aternos.me:45295
          type=offline
          username=AFK_Bot_1
          version=1.20.1

          [AppVars]
          showlinks=false

          [AutoAFK]
          enabled=true
          delay=10
          command=/ping

          [ReconnectionService]
          enabled=true
          delay=10
          interval=300
          EOF

      - name: 啟動 MCC 專用掛機機器人
        run: |
          # 不帶任何額外參數，直接讀取預設的 MinecraftClient.ini
          ./MinecraftClient
