name: 24/7 AFK Bot (MCC Auto-Build)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-mcc-bots:
    runs-on: ubuntu-latest
    steps:
      - name: 設定 .NET 環境並複製 MCC 源碼
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: 下載 MCC 原始碼與編譯
        run: |
          git clone --depth 1 https://github.com/MC-State/Minecraft-Console-Client.git mcc
          cd mcc/MinecraftClient
          dotnet build -c Release

      - name: 建立 AFK_Bot_1 與 AFK_Bot_2 設定檔
        run: |
          cat <<'EOF' > mcc/MinecraftClient/bin/Release/net8.0/bot1.ini
          [Main]
          ServerIP=baystellardynasty.aternos.me:45295
          Username=AFK_Bot_1
          Version=26.3
          ScriptEnabled=false

          [AppConfig]
          AutoRespawn=true
          ReconnectOnDisconnect=true
          ReconnectInterval=10
          EOF

          cat <<'EOF' > mcc/MinecraftClient/bin/Release/net8.0/bot2.ini
          [Main]
          ServerIP=baystellardynasty.aternos.me:45295
          Username=AFK_Bot_2
          Version=26.3
          ScriptEnabled=false

          [AppConfig]
          AutoRespawn=true
          ReconnectOnDisconnect=true
          ReconnectInterval=10
          EOF

      - name: 啟動兩隻 AFK 機器人
        run: |
          cd mcc/MinecraftClient/bin/Release/net8.0
          echo "正在啟動 AFK_Bot_1..."
          ./MinecraftClient bot1.ini &
          
          sleep 10
          
          echo "正在啟動 AFK_Bot_2..."
          ./MinecraftClient bot2.ini &
          
          wait
