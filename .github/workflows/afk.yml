name: 24/7 AFK Bot (Native)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-afk-bots:
    runs-on: ubuntu-latest
    steps:
      - name: 建立 AFK 保持連線腳本
        run: |
          cat <<'EOF' > raw_bot.js
          const net = require('net');

          const HOST = 'baystellardynasty.aternos.me';
          const PORT = 45295;

          function connectBot(username, delay) {
            setTimeout(() => {
              function start() {
                console.log(`[${username}] 正在連接至 ${HOST}:${PORT}...`);
                const client = new net.Socket();

                client.connect(PORT, HOST, () => {
                  console.log(`🟢 [${username}] 已建立 TCP 伺服器連線 (AFK 保持中)`);
                });

                client.on('data', (data) => {
                  // 維持 Socket 接收通訊數據，不處理實體位移與物理碰撞
                });

                client.on('error', (err) => {
                  console.log(`❌ [${username}] 連線錯誤:`, err.message);
                });

                client.on('close', () => {
                  console.log(`🔴 [${username}] 連線中斷，10 秒後自動重連...`);
                  setTimeout(start, 10000);
                });
              }
              start();
            }, delay);
          }

          connectBot('AFK_Bot_1', 0);
          connectBot('AFK_Bot_2', 5000);
          EOF

      - name: 執行 AFK 保持連線腳本
        run: node raw_bot.js
