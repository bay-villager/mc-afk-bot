name: 24/7 AFK Bot (Lightweight Real Player)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-afk-bots:
    runs-on: ubuntu-latest
    steps:
      - name: 安裝 Node.js 與 Mineflayer
        run: |
          npm init -y
          npm install mineflayer

      - name: 建立極簡輕量 AFK Bot 腳本
        run: |
          cat <<'EOF' > real_bot.js
          const mineflayer = require('mineflayer');

          const HOST = 'baystellardynasty.aternos.me';
          const PORT = 45295;

          function createBot(username) {
            console.log(`🤖 [${username}] 正在嘗試登入伺服器...`);
            
            const bot = mineflayer.createBot({
              host: HOST,
              port: PORT,
              username: username,
              version: false, // 自動配合 ViaVersion 匹配協定
              checkTimeoutInterval: 60 * 1000
            });

            // 當機器人順利進入遊戲世界時觸發
            bot.once('spawn', () => {
              console.log(`🟢 [${username}] 成功進到遊戲世界中！Aternos 關機倒數已停用。`);
              
              // 1. 停用物理運算，避免 26.3 物理校驗踢出
              if (bot.physics) {
                bot.physics.enabled = false;
              }

              // 2. 忽略世界 Chunk 更新，減少 CPU 與傳輸異常引起的斷線
              bot._client.on('map_chunk', () => {});
            });

            // 隨機在聊天室發送封包，確保連線活躍
            setInterval(() => {
              if (bot && bot.entity) {
                bot.swingArm('right');
              }
            }, 30000);

            bot.on('error', (err) => {
              console.log(`⚠️ [${username}] 發生錯誤:`, err.message);
            });

            bot.on('end', (reason) => {
              console.log(`🔴 [${username}] 已斷開連線 (${reason})，10 秒後重新登入...`);
              setTimeout(() => createBot(username), 10000);
            });
          }

          // 啟動 AFK 機器人
          createBot('AFK_Bot_1');
          setTimeout(() => {
            createBot('AFK_Bot_2');
          }, 8000);
          EOF

      - name: 執行 AFK 機器人
        run: node real_bot.js
